---
# ============================================================================
# SERVICE REMEDIATION: Reinicio controlado del servicio
# ============================================================================

- name: Create backup directory
  ansible.builtin.file:
    path: "{{ log_backup_dir }}"
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Backup rsyslog critical logs
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ log_backup_dir }}/{{ item | basename }}.{{ ansible_date_time.epoch }}"
    remote_src: true
    mode: "0644"
  loop:
    - /var/log/messages
    - /var/log/secure
  when: target_service == 'rsyslog'
  ignore_errors: true

- name: Get service status before restart
  ansible.builtin.systemd:
    name: "{{ target_service }}"
  register: service_before
  changed_when: false

- name: Display pre-restart service info
  ansible.builtin.debug:
    msg: |
      Service: {{ target_service }}
      Active: {{ service_before.status.ActiveState }}
      PID: {{ service_before.status.MainPID }}
      Memory: {{ service_before.status.MemoryCurrent | default('N/A') }}

- name: Restart target service
  ansible.builtin.systemd:
    name: "{{ target_service }}"
    state: restarted
    enabled: true
  register: service_restart
  notify: Service restarted

- name: Wait for service to be active
  ansible.builtin.systemd:
    name: "{{ target_service }}"
  register: service_status
  until: service_status.status.ActiveState == "active"
  retries: 12
  delay: 5

- name: Clear system cache (if enabled)
  block:
    - name: Sync filesystem
      ansible.builtin.command: sync
      changed_when: false

    - name: Clear page cache, dentries and inodes
      ansible.builtin.shell: |
        echo 3 > /proc/sys/vm/drop_caches
      args:
        executable: /bin/bash
      when:
        - clear_system_cache | bool
        - current_memory_percent | int > memory_critical_percent | int
      register: cache_clear

    - name: Display cache clear result
      ansible.builtin.debug:
        msg: "System cache cleared successfully"
      when: cache_clear is changed

  rescue:
    - name: Cache clear failed
      ansible.builtin.debug:
        msg: "WARNING: Could not clear system cache (non-critical)"
