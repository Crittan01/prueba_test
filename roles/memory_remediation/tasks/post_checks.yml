---
# ============================================================================
# POST-CHECKS: Validación post-remediación
# ============================================================================

- name: Wait 10 seconds for memory to stabilize
  ansible.builtin.pause:
    seconds: 10

- name: Get post-remediation memory usage
  ansible.builtin.shell: |
    set -o pipefail
    free | grep Mem | awk '{printf "%.0f", ($3/$2) * 100}'
  args:
    executable: /bin/bash
  register: post_memory_calc
  changed_when: false

- name: Set post-remediation memory fact
  ansible.builtin.set_fact:
    post_memory_percent: "{{ post_memory_calc.stdout }}"

- name: Calculate memory reduction
  ansible.builtin.set_fact:
    memory_reduction: "{{ current_memory_percent | int - post_memory_percent | int }}"

- name: Display remediation results
  ansible.builtin.debug:
    msg: |
      ╔══════════════════════════════════════════════════════════════╗
      ║                 REMEDIATION RESULTS                          ║
      ╠══════════════════════════════════════════════════════════════╣
      ║  Memory Before:  {{ current_memory_percent }}%
      ║  Memory After:   {{ post_memory_percent }}%
      ║  Reduction:      {{ memory_reduction }}%
      ║  Status:         {{ 'SUCCESS' if memory_reduction | int > 0 else 'INCONCLUSIVE' }}
      ╚══════════════════════════════════════════════════════════════╝

- name: Verify service is running
  ansible.builtin.systemd:
    name: "{{ target_service }}"
  register: final_service_check
  changed_when: false

- name: Assert service is active
  ansible.builtin.assert:
    that:
      - final_service_check.status.ActiveState == "active"
    fail_msg: "ERROR: Service {{ target_service }} is not active after restart!"
    success_msg: "Service {{ target_service }} is running normally"

- name: Get final memory breakdown
  ansible.builtin.command: free -h
  register: final_free
  changed_when: false

- name: Display final memory state
  ansible.builtin.debug:
    var: final_free.stdout_lines

- name: Set remediation status
  ansible.builtin.set_fact:
    remediation_successful: "{{ memory_reduction | int > 0 }}"
    remediation_end_time: "{{ ansible_date_time.iso8601 }}"
